services:
  # PostgreSQL - Metadata & crawl state
  # Data is stored in ./data/postgres so it survives `docker compose down`
  # and is accessible to local tooling. Exposed on host port 5433 to avoid
  # conflict with any local PostgreSQL instance running on 5432.
  postgres:
    image: postgres:15-alpine
    container_name: postharvest-postgres
    environment:
      POSTGRES_DB: postharvest_scraper
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: ph_scraper_pass
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper -d postharvest_scraper"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scraper-network

  # MinIO - Object storage for documents
  minio:
    image: minio/minio:latest
    container_name: postharvest-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - scraper-network

  # Qdrant - Vector database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: postharvest-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    networks:
      - scraper-network

  # Ollama - LLM serving
  # Only needed if you want to run Ollama inside Docker.
  # If your Ollama instance is on another machine, leave this commented out
  # and set OLLAMA_BASE_URL=http://<host>:11434 in your .env instead.
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: postharvest-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ./data/ollama:/root/.ollama
  #   environment:
  #     - OLLAMA_HOST=0.0.0.0:11434
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #   networks:
  #     - scraper-network

  # Prefect orchestration server
  prefect-db:
    image: postgres:15-alpine
    container_name: postharvest-prefect-db
    environment:
      POSTGRES_DB: prefect
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: prefect_pass
    volumes:
      - ./data/prefect-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect -d prefect"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scraper-network
    restart: unless-stopped

  prefect-server:
    image: prefecthq/prefect:2.20.18-python3.11
    container_name: postharvest-prefect
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      PREFECT_API_URL: http://localhost:4200/api
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_UI_API_URL: http://localhost:4200/api
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:prefect_pass@prefect-db:5432/prefect
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      prefect-db:
        condition: service_healthy
    networks:
      - scraper-network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: api
    container_name: postharvest-api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://scraper:ph_scraper_pass@postgres:5432/postharvest_scraper
      MINIO_ENDPOINT: minio:9000
      VECTOR_DB_PROVIDER: qdrant
      QDRANT_URL: http://qdrant:6333
      PREFECT_API_URL: http://prefect-server:4200/api
      # OLLAMA_BASE_URL is read from .env — point it at your Ollama host, e.g.:
      # OLLAMA_BASE_URL: http://192.168.1.50:11434
    volumes:
      - hf-cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      prefect-server:
        condition: service_healthy
    networks:
      - scraper-network
    restart: unless-stopped

  catalogue-worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: api
    container_name: postharvest-catalogue-worker
    command: python -m scripts.catalogue_worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://scraper:ph_scraper_pass@postgres:5432/postharvest_scraper
      VECTOR_DB_PROVIDER: qdrant
      QDRANT_URL: http://qdrant:6333
    volumes:
      - hf-cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - scraper-network
    restart: unless-stopped

  prefect-worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: prefect-worker
    container_name: postharvest-prefect-worker
    command:
      [
        "sh",
        "-c",
        "python scripts/deploy_flows.py --env \"$${ENVIRONMENT:-development}\" && exec prefect worker start --pool postharvest-pool",
      ]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://scraper:ph_scraper_pass@postgres:5432/postharvest_scraper
      MINIO_ENDPOINT: minio:9000
      VECTOR_DB_PROVIDER: qdrant
      QDRANT_URL: http://qdrant:6333
      PREFECT_API_URL: http://prefect-server:4200/api
    volumes:
      - hf-cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      prefect-server:
        condition: service_healthy
    networks:
      - scraper-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: postharvest-frontend
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - scraper-network
    restart: unless-stopped

networks:
  scraper-network:
    driver: bridge

volumes:
  hf-cache:
