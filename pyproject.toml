[tool.poetry]
name = "postharvest-scraper"
version = "0.1.0"
description = "AI-powered web scraper for post-harvest agricultural knowledge base"
authors = ["Fourlanes <edwin@fourlanes.tech>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"

# Orchestration & Workflow
prefect = "^2.14.0"
prefect-dask = {version = "^0.2.0", optional = true}

# Web Scraping
playwright = "^1.40.0"
scrapy = "^2.11.0"
httpx = {extras = ["http2"], version = "^0.25.0"}
beautifulsoup4 = "^4.12.0"
lxml = "^5.0.0"

# Content Extraction
trafilatura = "^1.6.0"
PyMuPDF = "^1.23.0"
pdfplumber = "^0.10.0"
python-docx = "^1.1.0"
openpyxl = "^3.1.0"
yt-dlp = "^2023.12.0"
pytesseract = "^0.3.10"  # OCR for scanned PDFs

# LLM & AI
openai = "^1.0.0"
bert-score = "^0.3.13"
ollama = {version = "^0.1.0", optional = true}
langchain = "^0.1.0"
langchain-community = "^0.0.10"
langchain-openai = "^0.0.5"
sentence-transformers = "^2.2.0"

# Storage & Database
psycopg2-binary = "^2.9.0"
sqlalchemy = "^2.0.0"
alembic = "^1.13.0"
minio = "^7.2.0"
qdrant-client = "^1.7.0"

# Data
pandas = "^2.1.0"

# API
fastapi = ">=0.109.0"
uvicorn = {extras = ["standard"], version = ">=0.27.0"}
slowapi = ">=0.1.9"

# Utils
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
loguru = "^0.7.0"
python-dotenv = "^1.0.0"
tenacity = "^8.2.0"
griffe = "<1.0.0"  # prefect 2.x requires griffe <1.0; griffe 1.0 moved griffe.dataclasses
tqdm = "^4.66.0"
python-multipart = ">=0.0.9"
aiofiles = "^23.2.0"

# Development
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.12.0"
ruff = "^0.1.0"
mypy = "^1.7.0"

[tool.poetry.extras]
distributed = ["prefect-dask"]
ollama = ["ollama"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
